name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, format, test
    # Pinned rather than `ubuntu-latest`, which is migrating to Ubuntu 26.
    # A silent OS change should never be able to break the build.
    runs-on: ubuntu-24.04

    # The integration tests run against a real Postgres and a real Redis —
    # no mocked database, no mocked limiter.
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: throttlebox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d throttlebox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/throttlebox
      REDIS_URL: redis://localhost:6379
      # CI-only values. Real deployments inject their own.
      SESSION_SECRET: ci-only-session-secret-not-for-production
      KEY_PEPPER: ci-only-key-pepper-not-for-production
      COOKIE_DOMAIN: localhost
      PORT: 3001

    steps:
      - uses: actions/checkout@v7

      # Reads the `packageManager` field from package.json, so the pnpm
      # version can never drift from the one the repo was developed against.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # pnpm 11 requires Node >= 22.13 (it uses `node:sqlite`). Node 24
          # is the current LTS and matches the local toolchain.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
